<!doctype html>
<!--
  LOCAL PREVIEW ONLY. Mimics how Qollab hosts a JS project:
  * injects ../index.html into <body>, loads ../main.css
  * defines a global `backend`
  * maps the Python module `quantum.experiment` to a JS mock via an import map

  Run from the repo root:   python3 -m http.server 8000
  Then open:                http://localhost:8000/dev/preview.html
  Simulate IonQ's one-job rule: http://localhost:8000/dev/preview.html?ionq&backend=ionq_simulator
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fragile Entanglement — local preview</title>
  <link rel="stylesheet" href="../main.css">
  <script type="importmap">
    { "imports": { "quantum.experiment": "./mock_experiment.js" } }
  </script>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <script type="module">
    globalThis.backend = { name: 'Local preview only' };
    const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
    document.body.insertAdjacentHTML('beforeend', html);
    // A fresh entry URL prevents the browser from reusing old preview code.
    const entry = new URL('../main.js', import.meta.url);
    entry.searchParams.set('preview', Date.now());
    await import(entry.href);
  </script>
</body>
</html>
